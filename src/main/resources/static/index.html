<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Centros de Acopio</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="login-page-body">

    <!-- Orbes ambientales con glow -->
    <div class="login-bg-glow-1"></div>
    <div class="login-bg-glow-2"></div>

    <div class="login-card">
        <div class="login-brand">
            <div class="login-logo-wrapper">
                <img src="logo.png" alt="Amarea Software" class="login-logo">
            </div>
            <h1 class="login-header-title">Iniciar Sesión</h1>
            <p class="login-header-subtitle">Ingresa tus credenciales para acceder a la plataforma de gestión</p>
        </div>

        <!-- Mensaje de error discreto y moderno para feedback del backend -->
        <div id="alertMessage" class="alert-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="alertText"></span>
        </div>

        <form id="loginForm">
            <div class="login-input-group">
                <label for="email" class="login-label">Correo Electrónico</label>
                <div class="login-field-box">
                    <span class="login-field-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </span>
                    <input type="email" id="email" class="login-input" placeholder="usuario@universidad.edu" required autocomplete="username">
                </div>
            </div>

            <div class="login-input-group">
                <label for="password" class="login-label">Contraseña</label>
                <div class="login-field-box">
                    <span class="login-field-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input autocomplete="current-password" type="password" id="password" class="login-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-login">
                <span>Entrar al Sistema</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                </svg>
            </button>
        </form>

        <div class="login-footer-info">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span>Plataforma Segura · Amarea Software</span>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnSubmit = document.getElementById('btnSubmit');
        const alertMessage = document.getElementById('alertMessage');
        const alertText = document.getElementById('alertText');

        function mostrarError(mensaje) {
            alertText.textContent = mensaje;
            alertMessage.style.display = 'flex';
        }

        function limpiarError() {
            alertMessage.style.display = 'none';
            alertText.textContent = '';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            limpiarError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                mostrarError('Por favor completa todos los campos requeridos.');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Verificando...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    let mensajeError = 'Credenciales incorrectas o usuario no encontrado.';
                    try {
                        const errorData = await response.json();
                        if (errorData && errorData.mensaje) {
                            mensajeError = errorData.mensaje;
                        }
                    } catch (parseErr) {
                        // Respuesta sin formato JSON
                    }
                    mostrarError(mensajeError);
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Entrar al Sistema';
                    return;
                }

                const data = await response.json();

                // Persistir sesión del usuario
                const rolEnMinuscula = (data.rol || '').toLowerCase();
                sessionStorage.setItem('rolActivo', rolEnMinuscula);
                sessionStorage.setItem('usuarioId', data.id);
                sessionStorage.setItem('usuarioNombre', data.nombre);
                sessionStorage.setItem('email', data.email);
                sessionStorage.setItem('usuarioEmail', data.email);
                sessionStorage.setItem('usuarioActivo', JSON.stringify(data));
                if (data.centroId) {
                    sessionStorage.setItem('centroId', data.centroId);
                    sessionStorage.setItem('centroNombre', data.centroNombre || '');
                    sessionStorage.setItem('tieneCentroAsignado', 'true');
                } else {
                    sessionStorage.removeItem('centroId');
                    sessionStorage.removeItem('centroNombre');
                    sessionStorage.setItem('tieneCentroAsignado', 'false');
                }
                if (data.institucionId) {
                    sessionStorage.setItem('institucionId', data.institucionId);
                    sessionStorage.setItem('institucionNombre', data.institucionNombre || '');
                }

                // Redirección inmediata al Menú Principal
                window.location.href = 'menu.html';

            } catch (networkError) {
                console.error('Error de conexión:', networkError);
                mostrarError('No se pudo conectar con el servidor backend. Verifica tu conexión.');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Entrar al Sistema';
            }
        });
    </script>
</body>

</html>
