<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Centros de Acopio</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="menu-body">

    <div class="login-card">
        <h2 class="mt-0">Iniciar Sesión</h2>
        <p class="text-muted mb-2">Ingresa tus credenciales para acceder al sistema.</p>

        <form id="loginForm">
            <div class="mb-1-5">
                <label for="email" class="font-semibold">Correo Electrónico</label>
                <input type="text" id="email" placeholder="usuario@universidad.edu" required>
            </div>

            <div class="mb-2">
                <label for="password" class="font-semibold">Contraseña</label>
                <input autocomplete="current-password" type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary">Entrar al Sistema</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.toLowerCase();

            // Persistencia de rol en sessionStorage
            if (email.includes('encargado')) {
                sessionStorage.setItem('rolActivo', 'encargado');
            } else if (email.includes('coordinador')) {
                sessionStorage.setItem('rolActivo', 'coordinador');
            } else {
                sessionStorage.setItem('rolActivo', 'voluntario');
            }

            // Redirección inmediata al Menú Principal
            window.location.href = 'menu.html';
        });
    </script>
</body>

</html>
